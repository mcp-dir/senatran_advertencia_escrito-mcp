# Smithery configuration for SENATRAN: Penalidade de Advertência por Escrito
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_senatran_advertencia_escrito

name: senatran_advertencia_escrito-mcp
displayName: "SENATRAN: Penalidade de Advertência por Escrito"
description: >
  SENATRAN: Penalidade de Advertência por Escrito, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/senatran_advertencia_escrito-mcp
repository: https://github.com/mcp-dir/senatran_advertencia_escrito-mcp

tags:
  - senatran_advertencia_escrito
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_senatran_advertencia_escrito

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_senatran_advertencia_escrito/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
